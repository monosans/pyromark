name: CI
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_17"
            pypy: true
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_28"
            pypy: true
          # - target: x86_64-unknown-linux-gnu
          #   runner: ubuntu-26.04
          #   manylinux: "2_34"
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          - target: i686-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_17"
            pypy: true
            # Docker's seccomp profile on ubuntu-26.04 breaks name resolution
            # in the 32-bit manylinux images.
            docker-options: --security-opt seccomp=unconfined
          - target: i686-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_28"
            pypy: true
            # Docker's seccomp profile on ubuntu-26.04 breaks name resolution
            # in the 32-bit manylinux images.
            docker-options: --security-opt seccomp=unconfined
          - target: i686-unknown-linux-musl
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            manylinux: "2_17"
            pypy: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            manylinux: "2_28"
            pypy: true
          # - target: aarch64-unknown-linux-gnu
          #   runner: ubuntu-26.04-arm
          #   manylinux: "2_34"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          # - target: arm-unknown-linux-musleabihf
          #   runner: ubuntu-26.04
          #   manylinux: musllinux_1_2
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-26.04
            manylinux: "2_17"
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-26.04
            manylinux: "2_28"
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          - target: powerpc64-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_17"
          - target: powerpc64le-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_17"
          - target: powerpc64le-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_28"
          - target: powerpc64le-unknown-linux-musl
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_17"
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_28"
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_31"
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_39"
            # maturin-action defaults to the native riscv64 pypa image here,
            # which cannot run on an x86_64 runner.
            container: ghcr.io/rust-cross/manylinux_2_39-cross:riscv64
          - target: riscv64gc-unknown-linux-musl
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          # - target: loongarch64-unknown-linux-gnu
          #   runner: ubuntu-26.04
          #   manylinux: "2_36"
          # - target: loongarch64-unknown-linux-musl
          #   runner: ubuntu-26.04
          #   manylinux: musllinux_1_2
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            pypy: true
            python-versions: |
              3.11
              3.12
              3.13
              3.14t
              3.15
              3.15t
              pypy3.11
              pypy3.12
              3.14
          - target: aarch64-apple-darwin
            runner: macos-26
            pypy: true
            python-versions: |
              3.11
              3.12
              3.13
              3.14t
              3.15
              3.15t
              pypy3.11
              pypy3.12
              3.14
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            python-versions: |
              3.11
              3.12
              3.13
              3.14
              3.14t
              3.15
              3.15t
              pypy3.11
              pypy3.12
            # Without the .exe, maturin does not run the interpreters it is
            # given: for PyPy it falls back to its bundled sysconfig, which tags
            # the wheels pp73 (PyPy 8 needs pp80), and for CPython it does not
            # learn the libs/ directory that the import-library linking below
            # needs.
            build-python-versions: >-
              python3.11.exe python3.12.exe python3.13.exe python3.14.exe
              python3.14t.exe python3.15.exe python3.15t.exe pypy3.11.exe
              pypy3.12.exe
            # PyO3 0.29.3 has no raw-dylib entry for libpypy3.12-c.dll, so it
            # links nothing (fixed by PyO3/pyo3#6429, not released yet). Link
            # the import libraries that PyPy ships instead.
            pyo3-use-raw-dylib: "0"
          - target: i686-pc-windows-msvc
            runner: windows-2025
            python-arch: x86
            python-versions: |
              3.11
              3.12
              3.13
              3.14
              3.14t
              3.15
              3.15t
          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
            python-versions: |
              3.11
              3.12
              3.13
              3.14
              3.14t
              3.15
              3.15t
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # uv installs standalone builds in seconds, setup-python needs minutes per
      # version on macOS. maturin finds them as python3.X / pypy3.X on PATH.
      - if: ${{ matrix.python-versions }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - if: ${{ matrix.python-versions }}
        shell: bash
        env:
          PYTHON_ARCH: ${{ matrix.python-arch }}
          PYTHON_VERSIONS: ${{ matrix.python-versions }}
        run: |
          for version in ${PYTHON_VERSIONS}; do
            requests+=("${version}${PYTHON_ARCH:+-${PYTHON_ARCH}}")
          done
          uv python install "${requests[@]}"
          uv python dir --bin >> "${GITHUB_PATH}"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          PYO3_USE_RAW_DYLIB: ${{ matrix.pyo3-use-raw-dylib || '1' }}
        with:
          args: --compatibility pypi --interpreter '${{ matrix.build-python-versions || format('3.11 3.12 3.13 3.14 3.14t 3.15 3.15t{0}', matrix.pypy && ' pypy3.11 pypy3.12' || '') }}' --out dist --release
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}
          docker-options: ${{ matrix.docker-options }}
          rust-toolchain: beta
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: |
            ${{ format('wheels-{0}-{1}', matrix.target, matrix.manylinux || 'auto') }}
          path: dist
  check:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build
      - clippy
      - docs-build
      - pre-commit
      - pytest
      - rustfmt
      - sdist
      - udeps
    runs-on: ubuntu-26.04
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
  clippy:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: beta
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +beta clippy --all-targets --
  docs-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheels-x86_64-unknown-linux-gnu-2_28
          path: dist
      - run: uv sync --group docs --no-group dev --no-install-project --locked
      - run: uv pip install --no-index --find-links dist pyromark
      - run: uv run --no-sync zensical build
      - if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  docs-deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: docs-build
    runs-on: ubuntu-26.04
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  pre-commit:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: false
      - run: uvx --no-cache prek run --all-files --show-diff-on-failure
        env:
          RUFF_OUTPUT_FORMAT: github
  pytest:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.15"
          - "3.15t"
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheels-x86_64-unknown-linux-gnu-2_28
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --no-install-project --locked
      - run: uv pip install --no-index --find-links dist pyromark
      - run: uv run --no-sync pytest
  release:
    runs-on: ubuntu-26.04
    if: ${{ github.repository_owner == 'monosans' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
      - sdist
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: false
      - run: uv publish --trusted-publishing always --no-cache 'wheels-*/*'
  rustfmt:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: nightly
          components: rustfmt
          cache: false
      - run: cargo +nightly fmt --check
  sdist:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
          rust-toolchain: beta
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-sdist
          path: dist
  udeps:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: nightly
          cache: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-udeps
          fallback: none
      - run: cargo +nightly udeps
