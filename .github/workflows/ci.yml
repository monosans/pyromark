name: CI
on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    needs:
      - licenses
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_17"
            pypy: pypy3.11 pypy3.12
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_28"
            pypy: /opt/python/pp311-pypy311_pp80/bin/python pypy3.12
          # - target: x86_64-unknown-linux-gnu
          #   runner: ubuntu-26.04
          #   manylinux: "2_34"
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          - target: i686-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_17"
            pypy: pypy3.11 pypy3.12
            # Docker's seccomp profile on ubuntu-26.04 breaks name resolution
            # in the 32-bit manylinux images.
            docker-options: --security-opt seccomp=unconfined
          - target: i686-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_28"
            pypy: /opt/python/pp311-pypy311_pp80/bin/python pypy3.12
            # Docker's seccomp profile on ubuntu-26.04 breaks name resolution
            # in the 32-bit manylinux images.
            docker-options: --security-opt seccomp=unconfined
          - target: i686-unknown-linux-musl
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            manylinux: "2_17"
            pypy: pypy3.11 pypy3.12
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            manylinux: "2_28"
            pypy: /opt/python/pp311-pypy311_pp80/bin/python pypy3.12
          # - target: aarch64-unknown-linux-gnu
          #   runner: ubuntu-26.04-arm
          #   manylinux: "2_34"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          # - target: arm-unknown-linux-musleabihf
          #   runner: ubuntu-26.04
          #   manylinux: musllinux_1_2
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-26.04
            manylinux: "2_17"
          - target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-26.04
            manylinux: "2_28"
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          - target: powerpc64-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_17"
          - target: powerpc64le-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_17"
          - target: powerpc64le-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_28"
          - target: powerpc64le-unknown-linux-musl
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_17"
          - target: s390x-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_28"
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_31"
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_39"
            # maturin-action defaults to the native riscv64 pypa image here,
            # which cannot run on an x86_64 runner.
            container: ghcr.io/rust-cross/manylinux_2_39-cross:riscv64
          - target: riscv64gc-unknown-linux-musl
            runner: ubuntu-26.04
            manylinux: musllinux_1_2
          - target: loongarch64-unknown-linux-gnu
            runner: ubuntu-26.04
            manylinux: "2_36"
          # - target: loongarch64-unknown-linux-musl
          #   runner: ubuntu-26.04
          #   manylinux: musllinux_1_2
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            pypy: pypy3.11 pypy3.12
            python-versions: |
              3.11
              3.12
              3.13
              3.14t
              3.15
              3.15t
              pypy3.11
              pypy3.12
              3.14
          - target: aarch64-apple-darwin
            runner: macos-26
            pypy: pypy3.11 pypy3.12
            python-versions: |
              3.11
              3.12
              3.13
              3.14t
              3.15
              3.15t
              pypy3.11
              pypy3.12
              3.14
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            pypy: pypy3.11 pypy3.12
            python-versions: |
              3.11
              3.12
              3.13
              3.14
              3.14t
              3.15
              3.15t
              pypy3.11
              pypy3.12
          - target: i686-pc-windows-msvc
            runner: windows-2025
            python-arch: x86
            python-versions: |
              3.11
              3.12
              3.13
              3.14
              3.14t
              3.15
              3.15t
          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
            python-versions: |
              3.11
              3.12
              3.13
              3.14
              3.14t
              3.15
              3.15t
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # uv installs standalone builds in seconds, setup-python needs minutes per
      # version on macOS. maturin finds them as python3.X / pypy3.X on PATH.
      - if: ${{ matrix.python-versions }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-arch: ${{ matrix.python-arch }}
      - if: ${{ matrix.python-versions }}
        shell: bash
        env:
          PYTHON_VERSIONS: ${{ matrix.python-versions }}
        run: |
          uv python install ${PYTHON_VERSIONS}
          uv python dir --bin >> "${GITHUB_PATH}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: third-party-licenses
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          # Without a pin maturin-action takes the newest maturin that
          # build-system.requires allows, bypassing Renovate's cooldown.
          maturin-version: 1.16.0
          # matrix.pypy lists the PyPy interpreters to build for. In the
          # manylinux 2_28 images, pypy3.11 is PyPy 7.3 (pp73), already built in
          # 2_17, so PyPy 3.11 8.0 (pp80) is passed by path.
          args: --compatibility pypi --interpreter '${{ format('3.11 3.12 3.13 3.14 3.14t 3.15 3.15t{0}', matrix.pypy && format(' {0}', matrix.pypy) || '') }}' --out dist --release
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}
          docker-options: ${{ matrix.docker-options }}
          rust-toolchain: beta
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: |
            ${{ format('wheels-{0}-{1}', matrix.target, matrix.manylinux || 'auto') }}
          path: dist
  check:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build
      - clippy
      - docs-build
      - licenses
      - pre-commit
      - pytest
      - release-guard
      - rustfmt
      - sdist
      - udeps
    runs-on: ubuntu-26.04
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
  clippy:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: beta
          components: clippy
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +beta clippy --all-targets --
  docs-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheels-x86_64-unknown-linux-gnu-2_28
          path: dist
      - run: uv sync --group docs --no-group dev --no-install-project --locked
      - run: uv pip install --no-index --find-links dist pyromark
      - run: uv run --no-sync zensical build
      - if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  docs-deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: docs-build
    runs-on: ubuntu-26.04
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # deploy the docs to GitHub Pages
      id-token: write # prove the deployment's origin to GitHub Pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  licenses:
    needs:
      - release-guard
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: beta
          # The licenses go into the wheels, so a tag must not restore a cache.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about
          fallback: none
      # Every build ships the licenses of the code it compiles in.
      - shell: bash
        run: |
          cargo +beta about generate --fail --locked about.hbs | tr -d '\r' > LICENSE-THIRD-PARTY
          cargo +beta run --locked --quiet --example syntax_licenses >> LICENSE-THIRD-PARTY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: third-party-licenses
          path: LICENSE-THIRD-PARTY
  pre-commit:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      # uvx and the hook environments prek installs read neither pyproject.toml
      # nor .npmrc, so their dependency cooldown is set here.
      - run: uvx --no-cache prek run --all-files --show-diff-on-failure
        env:
          NPM_CONFIG_MIN_RELEASE_AGE: "3" # days
          RUFF_OUTPUT_FORMAT: github
          UV_EXCLUDE_NEWER: 3 days
  pytest:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.15"
          - "3.15t"
        runner:
          - macos-26
          - ubuntu-26.04
          - windows-2025
        include:
          - runner: macos-26
            wheels: aarch64-apple-darwin-auto
          - runner: ubuntu-26.04
            wheels: x86_64-unknown-linux-gnu-2_28
          - runner: windows-2025
            wheels: x86_64-pc-windows-msvc-auto
          - python-version: pypy3.12
            runner: macos-26
            wheels: aarch64-apple-darwin-auto
          # The manylinux 2_17 images have no PyPy 3.12, so maturin builds
          # this wheel from its bundled sysconfig instead of an interpreter.
          - python-version: pypy3.12
            runner: ubuntu-26.04
            wheels: x86_64-unknown-linux-gnu-2_17
          - python-version: pypy3.12
            runner: windows-2025
            wheels: x86_64-pc-windows-msvc-auto
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheels-${{ matrix.wheels }}
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          # Unlike true, auto restores no cache on a tag.
          enable-cache: auto
          prune-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --group test-ci --no-group dev --no-install-project --locked
      - run: uv pip install --no-index --find-links dist pyromark
      - run: uv run --no-sync pytest
  release:
    runs-on: ubuntu-26.04
    if: ${{ github.repository_owner == 'monosans' && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
      - release-guard
      - sdist
    permissions:
      id-token: write # PyPI trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      # attest-action signs every file with one OIDC token that GitHub issues
      # for 5 minutes, and signing all of them can take longer, so sign in parts.
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: wheels-[a]*/*
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: wheels-[b-p]*/*
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: wheels-[q-s]*/*
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: wheels-[t-z]*/*
      - run: uv publish --trusted-publishing always --no-cache 'wheels-*/*'
  release-guard:
    runs-on: ubuntu-26.04
    steps:
      # The builds need this job, so off a tag it passes doing nothing.
      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          for file in Cargo.toml pyproject.toml; do
            version="$(grep -m 1 '^version = ' "${file}" | cut -d '"' -f 2)"
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in ${file}" >&2
              exit 1
            fi
          done
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main" >&2
            exit 1
          fi
  rustfmt:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: nightly
          components: rustfmt
          cache: false
      - run: cargo +nightly fmt --check
  sdist:
    needs:
      - licenses
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: third-party-licenses
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: 1.16.0
          command: sdist
          args: --out dist
          rust-toolchain: beta
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-sdist
          path: dist
  udeps:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: nightly
          cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-udeps
          fallback: none
      - run: cargo +nightly udeps
