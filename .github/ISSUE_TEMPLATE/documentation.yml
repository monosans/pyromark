name: 📖 Documentation
description: >-
  Report something wrong, missing or unclear in the pyromark documentation.
labels: ["documentation"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: >-
            I searched the [existing
            issues](https://github.com/monosans/pyromark/issues?q=is%3Aissue)
            and found nothing about this.
          required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page, or the docstring.
      placeholder: https://monosans.github.io/pyromark/guide/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What is wrong or missing?"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
