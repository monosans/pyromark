[project]
name = "pyromark"
version = "0.10.2"
description = "Blazingly fast CommonMark-compliant Markdown pull parser"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "monosans", email = "hsyqixco@protonmail.com" }]
keywords = [
  "commonmark",
  "gfm",
  "html",
  "markdown",
  "markdown-parser",
  "markdown-to-html",
  "parser",
  "pull-parser",
  "pulldown-cmark",
  "pyo3",
  "rust",
  "syntax-highlighting",
]
classifiers = [
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
urls.documentation = "https://monosans.github.io/pyromark"
urls.repository = "https://github.com/monosans/pyromark"
scripts.pyromark = "pyromark._cli:main"
dependencies = ["typing-extensions>=4.4.0"]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-github-actions-annotate-failures==0.4.2",
  "ruff==0.17.1",
]
docs = [
  "mkdocstrings==1.0.7",
  "mkdocstrings-python==2.0.9",
  "ruff==0.17.1",
  "zensical==0.0.71",
]

[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "pyromark._pyromark"
python-source = "python"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.rs" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
]
exclude-newer = "3 days"
