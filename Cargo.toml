[package]
name = "pyromark"
version = "0.10.1"
edition = "2024"
license = "MIT"
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/LICENSE-THIRD-PARTY",
  "/README.md",
  "/pyproject.toml",
  "/python/**/*.py",
  "/python/**/*.pyi",
  "/python/**/py.typed",
  "/src",
]
publish = false

[lib]
crate-type = ["cdylib"]
name = "_pyromark"

[dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false, features = [
  "html",
  "simd",
] }
pyo3 = "=0.30.1"
self_cell = "=1.3.0"
syntect = { version = "=5.3.0", default-features = false, features = [
  "default-themes",
  "html",
  "regex-onig",
] }
two-face = "=0.5.2"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
